# Project metadata and core configuration
[project]
name = "cvxsimulator"
version = "1.5.3"
description = "Simple simulator for investors"
authors = [{name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# `Private :: Do Not Upload` keeps rhiza_release.yml from publishing to PyPI.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Private :: Do Not Upload",
]
dependencies = [
    "jquantstats>=0.6.5",
    "numpy>=2.3.4",
    "pandas>=2.2.3",
    "polars>=1.34.0",
    "pyarrow>=19.0.0"
]

# Links to project resources
[project.urls]
Homepage = "https://github.com/cvxgrp/simulator"
Repository = "https://github.com/cvxgrp/simulator"

# Additional dependencies for development, testing, and documentation
[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[dependency-groups]
dev = [
    "cvxpy-base>=1.7.0",
    "clarabel>=0.9.0",
    "loguru",
    "tinycta>=0.5.0",
    "marimo>=0.17.0",
    "plotly>=6.5",
]
test = [
    "pytest>=7.0",
]

# Build system configuration
# Hatchling is a modern, extensible Python build backend
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Configuration for building wheel distributions
# Specifies which packages to include in the wheel
[tool.hatch.build.targets.wheel]
packages = ["src/cvx"]

[tool.rhiza-task]
# Settings for the task runner that replaced the synced make layer in rhiza v1.4.0. Read as
# layer 3 of rhiza-task's resolution order (defaults -> .rhiza/.env -> pyproject.toml ->
# RHIZA_* environment). Only entries that differ from the CLI's defaults belong here;
# `uvx rhiza-task print <setting>` shows what one resolves to.
#
# This table is the missing half of the v1.4.2 migration: `chore: drop the retired make
# layer` deleted the files that set the three values below, and every one of them is a
# non-default, so without this table the gates quietly relaxed. Verified after the deletion
# and before this table existed, `print` returned 90 / ty / ubuntu-latest.
#
# The defaults quoted below are rhiza-task 0.3.1's, which is the version the gates actually
# run: rhiza_ci.yml@v1.4.2 hardcodes `RHIZA_TASK: rhiza-task@0.3.1` for every gate step
# rather than reading a consumer's value, so the `RHIZA_TASK` pin in the root Makefile
# governs local `make` alone.

# `.rhiza/.env` had `COVERAGE_FAIL_UNDER=100`; the CLI defaults to 90, so the deletion
# lowered the bar by ten points. There is no [tool.coverage.report] table in this file, so
# .env was the *only* place the 100% gate lived — and a config file would not have saved it
# anyway, because `test` passes --cov-fail-under on the command line, which outranks one.
#
# [tool.check_test_layout] below sets enforce = false and cites this gate by name as the
# guarantee that replaces 1:1 test/source mirroring. That opt-out is only honest while the
# number is 100, which makes this line load-bearing for a second gate as well as its own.
coverage-fail-under = 100

# The retired python.mk had `TYPECHECKER ?= both`; the CLI defaults to `ty` alone, so the
# deletion dropped `mypy --strict` from the typecheck gate entirely. `both` is also stricter
# here than it was under make: the old shell `case` let mypy's exit status win, so a `ty`
# failure could pass, where the CLI raises on each run. Confirm from the CI log rather than
# from `print` — the typecheck job should show both `ty check` and `mypy --strict`.
typechecker = "both"

# `.rhiza/.env` had the three-OS matrix; the CLI defaults to ubuntu-latest alone.
# rhiza_ci.yml's `generate-matrix` job asks the CLI for this, so leaving it unset would have
# narrowed `ci / test` from nine jobs to three with nothing in the diff saying so — and this
# package reads paths and writes files, which is exactly what Windows and macOS catch.
ci-os-matrix = ["ubuntu-latest", "macos-latest", "windows-latest"]

# `.rhiza/.env` said `docs/notebooks`, which IS the CLI default -- but this repo has no such
# folder; the notebooks live in `book/marimo/notebooks`. The v1.4.2 migration note recorded
# that as pre-existing and deferred it, on the grounds that the marimo gate merely built an
# empty matrix and passed. v1.6.0 removed the "and passing" half: `rhiza_book.yml` gained a
# `book-nav` gate, and `_export_notebooks()` reads this setting, so a folder that is not
# there means no `notebooks/*.html` is ever exported.
marimo-folder = "book/marimo/notebooks"

# Not set, on purpose. This list is what stops the next person re-adding them:
#   source-folder         -- `.rhiza/.env` said `src`, already the CLI default.
#   mkdocs-extra-packages -- the deleted Makefile carried only
#                            `--with 'mkdocstrings[python]'`, which is now the default list.
#                            Restating it would be worse than omitting it: naming this
#                            setting REPLACES the default, so the line becomes the one
#                            someone edits to add a package, silently dropping mkdocstrings
#                            from the book build.
#   license-ignore-packages -- the only source was `LICENSE_IGNORE_PACKAGES += docutils` in
#                            the template's own marimo.mk. rhiza-task appends docutils itself
#                            whenever marimo is in the task registry, which it is here.
#   pytest-rhiza          -- no `RHIZA_CHECKS_VERSION` existed anywhere in the make layer;
#                            this repo ran the in-tree `.rhiza/tests/` suite that v1.4.2
#                            retires. Adopting the CLI's default is therefore an upgrade
#                            decision, not a value being preserved, so it stays unset.
#   python-version        -- the CLI reads `.python-version` (3.12) directly, as make did.
#   layers                -- the default registry already contains every task this repo uses,
#                            including book, marimo, lfs and paper.
#   book-output, zensical-version, uv-sync-args, license-fail-on, tests-folder,
#   deptry-ignore, strict, rhiza-checks -- the make layer's values were already the defaults.
#
# Not settings at all: PROJECT_NAME_EXTRA and LOG_LEVEL (cosmetic, from custom-env.mk),
# SHELL_KIND (belonged to completions.mk's install-completions, which v1.4.2 retires with no
# successor task), and LOGO_FILE from the old Makefile, which nothing in the tree read.

# Deptry configuration for dependency checking
# Map package names to their module names to suppress warnings
[tool.deptry.package_module_name_map]
cvxpy-base = "cvxpy"
jquantstats = "jquantstats"
numpy = "numpy"
pandas = "pandas"
polars = "polars"
clarabel = "clarabel"
loguru = "loguru"
tinycta = "tinycta"
marimo = "marimo"
plotly = "plotly"

# Specific rule ignores for dependency checking
[tool.deptry.per_rule_ignores]
#DEP002 = ["jquantstats"]
DEP001 = ["cvx", "cvxpy"]
DEP002 = ["pyarrow", "pytest"]

# MyPy configuration for type checking
[tool.mypy]
ignore_missing_imports = true

# Tests here are grouped by the behaviour they exercise, not by the module they
# import: interpolation splits into happy-path/error cases, and the portfolio
# and state suites each pair a behavioural file with a validation file. A 1:1
# tests/cvx/simulator/test_<module>.py mirror would scatter those groupings
# across the package tree without verifying anything more. What the mirror is
# there to guarantee — that no module drifts loose from its tests — is instead
# guaranteed by COVERAGE_FAIL_UNDER=100 in .rhiza/.env, which fails the build if
# any statement in src/ goes uncovered.
[tool.check_test_layout]
enforce = false
reason = "Tests are grouped by behaviour rather than mirroring source modules; per-module coverage is guaranteed instead by the total-coverage gate, coverage-fail-under = 100 in [tool.rhiza-task]. It moved there from .rhiza/.env when rhiza v1.4.2 retired the make layer."

# bump-my-version only auto-discovers .bumpversion.toml, .bumpversion.cfg,
# setup.cfg and pyproject.toml. Without a table here it falls back to
# `git describe`, so a release can be cut at an already-published version.
# It reads and rewrites [project].version natively — hence no current_version
# and no [[tool.bumpversion.files]] entry for it.
[tool.bumpversion]
allow_dirty = false
# The release flow commits and tags itself so the changelog lands in the bump commit.
commit = false
tag = false

