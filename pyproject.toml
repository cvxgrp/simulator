# Project metadata and core configuration
[project]
name = "cvxsimulator"
version = "1.5.3"
description = "Simple simulator for investors"
authors = [{name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# `Private :: Do Not Upload` keeps rhiza_release.yml from publishing to PyPI.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Private :: Do Not Upload",
]
dependencies = [
    "jquantstats>=0.6.5",
    "numpy>=2.3.4",
    "pandas>=2.2.3",
    "polars>=1.34.0",
    "pyarrow>=19.0.0"
]

# Links to project resources
[project.urls]
Homepage = "https://github.com/cvxgrp/simulator"
Repository = "https://github.com/cvxgrp/simulator"

# Additional dependencies for development, testing, and documentation
[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[dependency-groups]
dev = [
    "cvxpy-base>=1.7.0",
    "clarabel>=0.9.0",
    "loguru",
    "tinycta>=0.5.0",
    "marimo>=0.17.0",
    "plotly>=6.5",
]
test = [
    "pytest>=7.0",
]

# Build system configuration
# Hatchling is a modern, extensible Python build backend
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Configuration for building wheel distributions
# Specifies which packages to include in the wheel
[tool.hatch.build.targets.wheel]
packages = ["src/cvx"]

# Deptry configuration for dependency checking
# Map package names to their module names to suppress warnings
[tool.deptry.package_module_name_map]
cvxpy-base = "cvxpy"
jquantstats = "jquantstats"
numpy = "numpy"
pandas = "pandas"
polars = "polars"
clarabel = "clarabel"
loguru = "loguru"
tinycta = "tinycta"
marimo = "marimo"
plotly = "plotly"

# Specific rule ignores for dependency checking
[tool.deptry.per_rule_ignores]
#DEP002 = ["jquantstats"]
DEP001 = ["cvx", "cvxpy"]
DEP002 = ["pyarrow", "pytest"]

# MyPy configuration for type checking
[tool.mypy]
ignore_missing_imports = true

# Tests here are grouped by the behaviour they exercise, not by the module they
# import: interpolation splits into happy-path/error cases, and the portfolio
# and state suites each pair a behavioural file with a validation file. A 1:1
# tests/cvx/simulator/test_<module>.py mirror would scatter those groupings
# across the package tree without verifying anything more. What the mirror is
# there to guarantee — that no module drifts loose from its tests — is instead
# guaranteed by COVERAGE_FAIL_UNDER=100 in .rhiza/.env, which fails the build if
# any statement in src/ goes uncovered.
[tool.check_test_layout]
enforce = false
reason = "Tests are grouped by behaviour rather than mirroring source modules; per-module coverage is guaranteed instead by the 100% COVERAGE_FAIL_UNDER gate in .rhiza/.env."

# bump-my-version only auto-discovers .bumpversion.toml, .bumpversion.cfg,
# setup.cfg and pyproject.toml. Without a table here it falls back to
# `git describe`, so a release can be cut at an already-published version.
# It reads and rewrites [project].version natively — hence no current_version
# and no [[tool.bumpversion.files]] entry for it.
[tool.bumpversion]
allow_dirty = false
# The release flow commits and tags itself so the changelog lands in the bump commit.
commit = false
tag = false

