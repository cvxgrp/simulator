# This is NOT a duplicate of rhiza_release.yml — do not "consolidate" the two.
#
# The split is deliberate. pyproject.toml carries the `Private :: Do Not Upload`
# classifier, which rhiza_release.yml greps for and, finding it, skips its own
# PyPI publish step. rhiza_release.yml therefore does the tag, the GitHub release
# and the changelog; this file is the *only* thing that publishes to PyPI.
# Deleting it stops releases reaching PyPI entirely.
#
# It cannot be folded into rhiza_release.yml either: PyPI Trusted Publishing
# (OIDC) validates the exact workflow file path and repository that invokes
# pypa/gh-action-pypi-publish, and the configured publisher names this file.
#
# Publishing is manual (workflow_dispatch) and has to be triggered after the
# version bump lands.
name: RELEASE TO PYPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Get latest tag
        id: latest_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout at latest tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ steps.latest_tag.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          version: "0.10.7"

      - name: Build
        run: uvx hatch build

      - name: Publish to PyPI
        # Pinned to a tag rather than the moving `release/v1` branch: this is the
        # step holding `id-token: write`. rhiza_release.yml pins the same version.
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
